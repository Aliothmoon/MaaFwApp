name: Android build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/real-screen-off-volume-down-wake"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # API 37 is not yet published in the public SDK repository used by hosted runners.
      # Compile the source against API 36 in CI; the project SDK baseline remains unchanged.
      - name: Use available SDK for CI compile check
        run: sed -i 's/internal const val COMPILE_SDK = 37/internal const val COMPILE_SDK = 36/' build-logic/convention/src/main/kotlin/com/aliothmoon/maafw/gradle/AndroidCommon.kt

      - name: Build debug APK and run unit tests
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest
